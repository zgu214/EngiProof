[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "engiproof-engineering"
version = "0.2.0"
description = "Source-bounded research reproduction and engineering evidence framework"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pypdf>=5,<7", "fonttools>=4,<5"]
authors = [
  {name = "Zhiqiang Gu", email = "Zhiqiang.gu214@gmail.com"}
]
keywords = ["engineering", "reproducibility", "research", "verification", "evidence", "subsea"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
engiproof = "engiproof.cli:main"
engiproof-mcp = "engiproof.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]
