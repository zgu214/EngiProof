name: CI
on:
  push:
  pull_request:
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[mcp]
      - name: Snapshot tracked files
        run: git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/tracked.sha256"
      - run: engiproof doctor
      - run: engiproof verify-all
      - name: Cross-environment record (all studies, non-mutating)
        run: |
          engiproof environment-record --out "$RUNNER_TEMP/environment_record.json" --compact > "$RUNNER_TEMP/environment_record.line"
          echo "::notice title=engiproof-environment-record::$(cat "$RUNNER_TEMP/environment_record.line")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-record-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/environment_record.json
          if-no-files-found: warn
      - run: python -m unittest discover -s tests -v
      - name: Verification and tests left tracked files unchanged
        run: sha256sum --quiet -c "$RUNNER_TEMP/tracked.sha256"
